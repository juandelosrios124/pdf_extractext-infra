# CI de la infraestructura compartida (Consul + Traefik).
# Cada paso usa los mismos comandos que se corren a mano (ver README, "CI").

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Con shell explicito Actions usa "bash -eo pipefail".
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 scripts/*.sh

      - name: Makefile (sin los otros repos)
        # make help, orden de make -n up y make -n down, env -u de los tokens,
        # los errores de make check y el modo release (RELEASE=1: -f, sin
        # --build, tags), con carpetas temporales y un .env de prueba. No clona
        # extract-service ni documents-service.
        run: scripts/test-makefile.sh

      - name: traefik/dynamic.yml parsea
        run: pipx run yamllint==1.38.0 -d relaxed traefik/dynamic.yml

      - name: consul/consul.json parsea
        run: jq empty consul/consul.json

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: .env no esta versionado
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error file=.env::.env esta versionado; sacarlo con git rm --cached .env"
            exit 1
          fi

      - name: Generar .env de prueba
        # Un UUID nuevo por token. Cada token va en su propia linea: si uuidgen
        # falla, bash -e corta aca (dentro del argumento de sed no cortaria y
        # quedaria vacio). El grep evita que un sed sin coincidencias deje la
        # variable sin valor en silencio.
        run: |
          cp .env.example .env
          for var in CONSUL_HTTP_TOKEN CONSUL_AGENT_TOKEN CONSUL_TRAEFIK_TOKEN \
                     CONSUL_EXTRACT_TOKEN CONSUL_DOCUMENTS_TOKEN; do
            grep -q "^$var=" .env || { echo "::error file=.env.example::falta $var"; exit 1; }
            token=$(uuidgen)
            sed -i "s/^$var=.*/$var=$token/" .env
          done

      - name: docker compose config
        run: docker compose config --quiet

  consul-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generar .env de prueba
        # Un UUID nuevo por token. Cada token va en su propia linea: si uuidgen
        # falla, bash -e corta aca (dentro del argumento de sed no cortaria y
        # quedaria vacio). El grep evita que un sed sin coincidencias deje la
        # variable sin valor en silencio.
        run: |
          cp .env.example .env
          for var in CONSUL_HTTP_TOKEN CONSUL_AGENT_TOKEN CONSUL_TRAEFIK_TOKEN \
                     CONSUL_EXTRACT_TOKEN CONSUL_DOCUMENTS_TOKEN; do
            grep -q "^$var=" .env || { echo "::error file=.env.example::falta $var"; exit 1; }
            token=$(uuidgen)
            sed -i "s/^$var=.*/$var=$token/" .env
          done

      - name: consul validate (misma imagen que el compose)
        # data_dir no esta en consul.json: en el compose lo pasa el entrypoint
        # como flag al arrancar el agent. Aca se agrega por CONSUL_LOCAL_CONFIG
        # (el entrypoint lo escribe en /consul/config/local.json) y se valida
        # el directorio entero, como lo carga el agente.
        run: |
          image=$(docker compose config --format json | jq -er '.services.consul.image')
          echo "imagen: $image"
          docker run --rm -e CONSUL_LOCAL_CONFIG='{"data_dir":"/consul/data"}' \
            -v "$PWD/consul/consul.json:/consul/config/consul.json:ro" \
            "$image" consul validate /consul/config

  scan:
    # Grype sobre las imagenes de terceros que levanta infra (Traefik y Consul).
    # Informativo: no falla por hallazgos. No se pueden parchear, solo subir de
    # version, asi que cortar la CI no deja nada que hacer (ver README,
    # "Escaneo de imagenes"). El paso si falla si Grype no llega a escanear una
    # imagen: eso es un problema del escaneo, no un hallazgo.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generar .env de prueba
        # docker compose config necesita los tokens para resolver el compose.
        # Un UUID nuevo por token; el .env real nunca se usa.
        run: |
          cp .env.example .env
          for var in CONSUL_HTTP_TOKEN CONSUL_AGENT_TOKEN CONSUL_TRAEFIK_TOKEN \
                     CONSUL_EXTRACT_TOKEN CONSUL_DOCUMENTS_TOKEN; do
            grep -q "^$var=" .env || { echo "::error file=.env.example::falta $var"; exit 1; }
            token=$(uuidgen)
            sed -i "s/^$var=.*/$var=$token/" .env
          done

      - name: Grype sobre las imagenes del compose
        # La lista sale de "docker compose config --images", no de una lista
        # aparte que se desincronizaria de lo que esta fijado en el compose.
        # consul y consul-acl-init comparten imagen: scan.sh la escanea una vez.
        # La version de Grype esta fijada en scripts/scan.sh.
        run: |
          mapfile -t images < <(docker compose config --images)
          printf 'imagenes del compose: %s\n' "${images[*]}"
          scripts/scan.sh --images "${images[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: [lint, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generar .env de prueba
        # Un UUID nuevo por token. Cada token va en su propia linea: si uuidgen
        # falla, bash -e corta aca (dentro del argumento de sed no cortaria y
        # quedaria vacio). El grep evita que un sed sin coincidencias deje la
        # variable sin valor en silencio.
        run: |
          cp .env.example .env
          for var in CONSUL_HTTP_TOKEN CONSUL_AGENT_TOKEN CONSUL_TRAEFIK_TOKEN \
                     CONSUL_EXTRACT_TOKEN CONSUL_DOCUMENTS_TOKEN; do
            grep -q "^$var=" .env || { echo "::error file=.env.example::falta $var"; exit 1; }
            token=$(uuidgen)
            sed -i "s/^$var=.*/$var=$token/" .env
          done

      - name: Levantar consul, consul-acl-init y traefik
        # --wait espera a que consul y traefik esten healthy y a que el
        # one-shot consul-acl-init termine con exit 0 (si falla, falla el up).
        run: |
          docker network create mired
          docker compose up -d --wait --wait-timeout 120
          docker compose ps

      - name: Consul tiene lider
        run: |
          leader=$(curl -s 127.0.0.1:8500/v1/status/leader)
          echo "lider: $leader"
          [[ $leader == *:8300* ]]

      - name: Traefik /ping
        run: |
          ping=$(curl -s 127.0.0.1:8081/ping)
          echo "ping: $ping"
          [[ $ping == OK ]]

      - name: Traefik providers (ConsulCatalog y File)
        run: |
          curl -s 127.0.0.1:8081/api/overview | jq -c .providers \
            | tee /dev/stderr \
            | jq -e 'index("ConsulCatalog") != null and index("File") != null'

      - name: smoke-acl.sh
        # default_policy deny: 403 sin token y con el token de otro servicio,
        # Traefik solo lectura, catalogo anonimo vacio y agente sin errores.
        run: scripts/smoke-acl.sh

      - name: smoke-traefik.sh
        run: scripts/smoke-traefik.sh

      - name: smoke-timeouts.sh
        # Presupuesto de timeouts (README): 200 a 20 s, 504 a ~25 s y 504 con
        # subida lenta sin que lo corte writeTimeout. Tarda ~1,5 min.
        run: scripts/smoke-timeouts.sh

      - name: Logs (si algo fallo)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: docker compose down -v
        if: always()
        run: docker compose down -v
